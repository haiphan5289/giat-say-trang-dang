<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0ea5e9"/>

  <!-- Washing machine body -->
  <rect x="6" y="5" width="20" height="22" rx="2" fill="white" opacity="0.15"/>
  <rect x="6" y="5" width="20" height="22" rx="2" stroke="white" stroke-width="1.5"/>

  <!-- Control panel top -->
  <rect x="6" y="5" width="20" height="6" rx="2" fill="white" opacity="0.25"/>

  <!-- Power button dot -->
  <circle cx="23" cy="8" r="1.2" fill="white"/>

  <!-- Small indicator dots -->
  <circle cx="9" cy="8" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="11.5" cy="8" r="0.8" fill="white" opacity="0.5"/>

  <!-- Drum circle outer -->
  <circle cx="16" cy="19" r="7" stroke="white" stroke-width="1.5"/>

  <!-- Drum circle inner -->
  <circle cx="16" cy="19" r="4.5" stroke="white" stroke-width="1" opacity="0.5"/>

  <!-- Water ripple lines inside drum -->
  <path d="M12.5 19 Q14 17.5 16 19 Q18 20.5 19.5 19" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Drum holes -->
  <circle cx="13" cy="16" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="19" cy="16" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="13" cy="22" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="19" cy="22" r="0.7" fill="white" opacity="0.6"/>
</svg>
